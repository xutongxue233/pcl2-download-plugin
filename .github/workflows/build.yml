name: Build injector

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows build and package
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        # The verification scripts load .NET Framework assemblies.
        shell: powershell
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.301'

      - name: Build injector and verify embedded payload
        run: ./scripts/Build-Injector.ps1 -Configuration Release

      - name: Package injector and source
        run: ./scripts/Package-Injector.ps1

      # The official PCL executable is not redistributed in this repository.
      # Host-dependent installation, runtime, and GUI tests run separately.
      - name: Report validation scope
        run: |
          @'
          Built the bootstrap, download plugin, and WPF injector from source.
          Verified the embedded payload and generated the binary and source ZIPs.
          Official-host installation, runtime, and GUI tests are not run in this workflow.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload injector ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/PCL.DownloadRestore.Injector-2.99.0.0.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload source ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/PCL.DownloadRestore.Injector-Source.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
